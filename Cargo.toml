[workspace]
resolver = "3"
members = [
    "crates/alfdf-ast",
    "crates/alfdf-parser",
    "crates/alfdf-typeck",
    "crates/alfdf-totality",
    "crates/alfdf-vm",
    "crates/alfdf-fuzz",
    "crates/alfdf-storage",
    "crates/alfdf-embed",
    "crates/alfdf-dedup",
    "crates/alfdf-synthesize",
    "crates/alfdf-pipeline",
    "crates/alfdf-mcp",
    "crates/alfdf-stdlib",
    "crates/alfdf-metrics",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
